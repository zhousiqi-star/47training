<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>添加训练视频 · 47的健身小帮手</title>
<meta name="description" content="填表生成视频数据代码，复制粘贴到 data/videos.js 即可。">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <h1><a href="index.html"><span class="brand-mark">47</span><span class="brand-text">的健身小帮手</span></a></h1>
    <nav class="site-nav">
      <a href="index.html">动作搜索</a>
      <a href="videos.html" class="active">训练视频</a>
      <a href="plan.html">今日计划</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="editor-head">
    <a class="back" href="videos.html">← 返回训练视频</a>
    <h2 class="editor-title">添加训练视频</h2>
    <p class="editor-sub">
      填好左边，右边实时生成代码。点「复制代码」，粘贴到 <code>data/videos.js</code> 的
      <code>];</code> 前面，保存刷新就有了。视频本身不用上传，粘链接就行。
    </p>
  </section>

  <div class="editor-layout">

    <!-- 左：表单 -->
    <section class="editor-form">

      <div class="field">
        <label>要做什么？</label>
        <div class="mode-tabs" id="mode-tabs">
          <button type="button" class="mode-tab active" data-mode="new">新增视频</button>
          <button type="button" class="mode-tab" data-mode="edit">编辑已有的</button>
        </div>
      </div>

      <div class="field" id="existing-wrap" hidden>
        <label for="f-existing">选择要编辑的视频</label>
        <select id="f-existing"></select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-athlete">运动员 <span class="req">必填</span></label>
          <input id="f-athlete" type="text" placeholder="例如：吕小军">
        </div>
        <div class="field">
          <label for="f-sport">项目</label>
          <input id="f-sport" type="text" list="sports" placeholder="例如：举重">
          <datalist id="sports">
            <option value="健美"></option>
            <option value="举重"></option>
            <option value="田径"></option>
            <option value="足球"></option>
            <option value="篮球"></option>
            <option value="游泳"></option>
            <option value="滑雪"></option>
            <option value="拳击"></option>
            <option value="体操"></option>
            <option value="格斗"></option>
            <option value="力量举"></option>
            <option value="自行车"></option>
          </datalist>
        </div>
      </div>

      <div class="field">
        <label for="f-title">视频标题 <span class="req">必填</span></label>
        <input id="f-title" type="text" placeholder="例如：挺举技术拆解">
      </div>

      <div class="field">
        <label for="f-url">视频链接</label>
        <input id="f-url" type="text" placeholder="https://www.bilibili.com/video/BVxxxxxxxx">
        <p class="field-note" id="url-note"></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-duration">时长</label>
          <input id="f-duration" type="text" placeholder="12:30">
        </div>
        <div class="field">
          <label for="f-cover">封面图（可选）</label>
          <div class="id-row">
            <input id="f-cover" type="text" placeholder="拖图片进来，或 images/xxx.jpg">
            <button type="button" class="mini-btn" id="cover-clear">清除</button>
          </div>
          <p class="field-note" id="cover-note"></p>
        </div>
      </div>

      <div class="field">
        <label>封面图标</label>
        <div class="emoji-picks" id="emoji-picks"></div>
        <input id="f-emoji" type="text" maxlength="4" placeholder="🎬">
      </div>

      <div class="field">
        <label>封面配色</label>
        <div class="tone-picks" id="tone-picks"></div>
      </div>

      <div class="field">
        <label for="f-note">看点说明</label>
        <textarea id="f-note" rows="3" placeholder="一句话说明这个视频值得看什么"></textarea>
      </div>

      <div class="field">
        <label for="f-tags">标签（用逗号分隔）</label>
        <input id="f-tags" type="text" placeholder="背, 力量, 健美">
      </div>

      <div class="field">
        <label for="f-id">唯一标识 id</label>
        <div class="id-row">
          <input id="f-id" type="text" placeholder="video-xxxxxx">
          <button type="button" class="mini-btn" id="regen-id">换一个</button>
        </div>
        <p class="field-note" id="id-note"></p>
      </div>

    </section>

    <!-- 右：预览 -->
    <section class="editor-preview">
      <h3 class="preview-label">封面预览</h3>
      <div class="cover-drop" id="cover-drop">
        <div class="preview-card-wrap" id="preview-card"></div>
        <p class="cover-drop-hint" id="cover-drop-hint">拖图片到这里，或点击选择文件</p>
      </div>
      <input type="file" id="cover-file" accept="image/*" hidden>

      <h3 class="preview-label">生成的代码</h3>
      <p class="code-hint" id="code-hint"></p>
      <pre class="code-box" id="code-box"></pre>

      <button type="button" class="copy-btn" id="copy-btn">复制代码</button>
      <p class="editor-hint" id="editor-hint"></p>
    </section>

  </div>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      这个页面是站长工具，只用来生成代码，不会把数据发到任何地方，也不会上传到服务器。
      生成的代码需要你自己粘贴到 data/videos.js。
    </p>
  </div>
</footer>

<script src="data/videos.js"></script>
<script src="assets/editor.js"></script>
</body>
</html>
