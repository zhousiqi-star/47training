<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日训练计划 · 47的健身小帮手</title>
<meta name="description" content="先选今天练哪个部位，再安排具体动作，点亮每一组记录完成进度。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <h1><a href="index.html"><span class="brand-mark">47</span><span class="brand-text">的健身小帮手</span></a></h1>
    <nav class="site-nav">
      <a href="index.html">动作搜索</a>
      <a href="videos.html">训练视频</a>
      <a href="plan.html" class="active">今日计划</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="plan-layout">

    <!-- 左上角：今天练什么 -->
    <aside class="plan-side">
      <div class="focus-card">
        <h3 class="focus-title">今天练什么？</h3>
        <p class="focus-sub">选一个部位，加动作时只会出现这个部位的动作</p>
        <div class="focus-list" id="focus-list"></div>
        <p class="focus-note" id="focus-note"></p>
      </div>
    </aside>

    <!-- 右侧：计划卡片 -->
    <div class="plan-main">
      <section class="plan-head">
        <h2 class="plan-title">今天的训练计划</h2>
        <p class="plan-sub" id="plan-sub"></p>
      </section>

      <div class="plan-progress">
        <div class="plan-progress-bar" id="progress-bar"></div>
      </div>

      <section class="plan-list" id="plan-list"></section>

      <div class="plan-foot">
        <button type="button" class="add-card" id="add-card">＋ 添加动作</button>
        <button type="button" class="reset" id="clear-plan">清空今天的计划</button>
      </div>
    </div>

  </div>

</main>

<!-- 选择动作：居中面板 -->
<div class="overlay" id="overlay" hidden>
  <div class="picker-panel" id="picker-panel">
    <div class="picker-panel-head">
      <input id="pick-q" type="search" autocomplete="off" placeholder="搜索动作…">
      <button type="button" id="pick-close" aria-label="关闭">✕</button>
    </div>
    <div class="pick-range" id="pick-range"></div>
    <div class="pick-quick" id="pick-quick"></div>
    <div class="pick-list" id="pick-list"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>
      免责声明：本站内容仅供参考，不构成医疗或训练处方建议。训练计划请根据自身恢复能力和
      健康状况调整，出现疼痛请立即停止并咨询专业人士。
    </p>
  </div>
</footer>

<script src="data/exercises.js"></script>
<script src="assets/search-core.js"></script>
<script src="assets/plan-page.js"></script>
</body>
</html>
