<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索结果 · 47的健身小帮手</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <h1><a href="index.html"><span class="brand-mark">47</span><span class="brand-text">的健身小帮手</span></a></h1>
    <nav class="site-nav">
      <a href="index.html" class="active">动作搜索</a>
      <a href="videos.html">训练视频</a>
      <a href="plan.html">今日计划</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="search-area">
    <form action="search.html" method="get" autocomplete="off">
      <div class="search-input-wrap">
        <span class="icon">🔍</span>
        <input id="q" name="q" type="search"
               placeholder="搜索动作、肌群或器械，例如：哑铃 背">
      </div>
    </form>
  </section>

  <section class="filters" id="filters"></section>

  <div class="result-bar">
    <p class="result-count" id="count"></p>
    <button class="reset" id="reset" hidden>清空搜索和筛选</button>
  </div>

  <section class="grid" id="results"></section>

  <p class="empty" id="empty" hidden>
    <strong>没有找到匹配的动作</strong>
    换个说法试试，比如搜「练背」「无器械」，或者清空筛选条件。
  </p>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      免责声明：本站内容仅供参考，不构成医疗或训练处方建议。开始任何训练计划前，
      请根据自身健康状况咨询医生或专业教练。动作姿势不当可能造成运动损伤，请量力而行。
    </p>
  </div>
</footer>

<script src="data/exercises.js"></script>
<script src="assets/search-core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
