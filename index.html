<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日训练 · 947fitness</title>
<meta name="description" content="选今天练哪个部位，安排具体动作，点亮每一组记录完成进度。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="947fitness · 今日训练">
<meta property="og:description" content="选部位 → 加动作 → 点圆点记组数。把每一次训练都留下来。">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header">
  <div class="wrap header-row">
    <h1><a href="index.html"><span class="brand-mark">947</span><span class="brand-text">fitness</span></a></h1>
    <nav class="site-nav">
      <a href="index.html" class="active">今日训练</a>
      <a href="history.html">训练历史</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <div class="plan-layout">
    <div class="plan-main">

      <section class="plan-head">
        <h1 class="plan-title">今天的训练</h1>
        <p class="plan-date" id="plan-date"></p>
      </section>

      <section class="meter" id="meter">
        <div class="meter-top">
          <span class="meter-num"><b id="meter-done">0</b><i>/</i><em id="meter-total">0</em></span>
          <span class="meter-unit">组</span>
          <span class="meter-pct" id="meter-pct"></span>
        </div>
        <div class="plan-progress">
          <div class="plan-progress-bar" id="progress-bar"></div>
        </div>
        <div class="meter-foot">
          <p class="plan-sub" id="plan-sub"></p>
          <button type="button" class="meter-out" id="output-card" hidden>输出记录</button>
        </div>
      </section>

      <section class="focus-card">
        <h2 class="focus-title">练什么</h2>
        <p class="focus-sub">选一个部位，加动作时只显示这个部位的动作</p>
        <div class="focus-list" id="focus-list"></div>
        <p class="focus-note" id="focus-note"></p>
      </section>

      <section class="plan-list" id="plan-list"></section>

      <div class="plan-foot">
        <button type="button" class="add-card" id="add-card">添加动作</button>
        <button type="button" class="seal" id="seal-day">封存今天的清单</button>
        <button type="button" class="reset" id="clear-plan">清空今天的记录</button>
      </div>

    </div>
  </div>

</main>

<!-- 选择动作：居中面板 -->
<div class="overlay" id="overlay" hidden>
  <div class="picker-panel" id="picker-panel">
    <div class="picker-panel-head">
      <input id="pick-q" type="search" autocomplete="off" placeholder="搜索动作…">
      <button type="button" id="pick-close" aria-label="关闭">✕</button>
    </div>
    <div class="pick-range" id="pick-range"></div>
    <div class="pick-quick" id="pick-quick"></div>
    <div class="pick-list" id="pick-list"></div>
  </div>
</div>

<!-- 今天这张记录：读数快照（封存之后才给输出） -->
<div class="overlay" id="card-overlay" hidden>
  <div class="card-panel">
    <div class="card-panel-head">
      <h2 class="card-panel-title">今天这张记录</h2>
      <button type="button" class="card-close" id="card-close" aria-label="关闭">✕</button>
    </div>
    <div class="card-stage">
      <canvas id="card-canvas" width="1080" height="1350" role="img"
              aria-label="今天的训练记录卡"></canvas>
    </div>
    <p class="card-hint" id="card-hint"></p>
    <div class="card-actions">
      <button type="button" class="card-save" id="card-save">保存图片</button>
      <button type="button" class="card-copy" id="card-copy">复制文字</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>
      免责声明：本站内容仅供参考，不构成医疗或训练处方建议。训练请根据自身恢复能力和
      健康状况调整，出现疼痛请立即停止并咨询专业人士。
    </p>
  </div>
</footer>

<script src="exercises.js"></script>
<script src="search-core.js"></script>
<script src="history.js"></script>
<script src="card.js"></script>
<script src="plan-page.js"></script>
</body>
</html>
